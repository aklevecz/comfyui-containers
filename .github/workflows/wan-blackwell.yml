name: wan-blackwell

# Builds the Wan/Blackwell ComfyUI image on a GitHub runner and pushes it to
# GHCR, where RunPod can pull it as an ordinary Pod template.
#
# Why not RunPod's own GitHub integration: it is Serverless-only, it requires a
# runpod handler function (this image serves an interactive ComfyUI UI on 8188,
# so there is no handler), and images it builds are locked to RunPod's
# infrastructure -- they cannot be pulled for a Pod.

on:
  push:
    branches: [main]
    paths:
      - 'wan-blackwell/**'
      # A cold build is 12 minutes and there is no cache, so documentation
      # edits should not pay for one.
      - '!wan-blackwell/README.md'
      - '.github/workflows/wan-blackwell.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/comfyui-wan-blackwell

# Two pushes in quick succession used to race: both built, both pushed the same
# moving tag, and whichever finished last won regardless of which commit was
# newer. Immutable tags make that harmless now, but cancelling the superseded
# run also stops paying for a 12-minute build nobody wants the output of.
concurrency:
  group: wan-blackwell
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      # cu128-devel + torch + ~10 node packs lands around 25 GB, and BuildKit
      # needs room for both the layer cache and the outgoing push. A stock
      # runner does not have the headroom; these preinstalled toolchains are
      # unused here and buy back roughly 30 GB.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost
          sudo docker image prune --all --force
          echo "--- after ---"
          df -h /

      - uses: actions/checkout@v4

      # Date first so tags sort chronologically in the GHCR listing; short sha
      # makes each one immutable and traceable back to a commit. Computed in a
      # step because expressions cannot slice github.sha.
      - name: Compute tags
        id: tags
        run: |
          SHORT=$(git rev-parse --short=12 HEAD)
          BUILD="$(date -u +%Y%m%d)-${SHORT}"
          echo "short=${SHORT}"  >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}"  >> "$GITHUB_OUTPUT"
          echo "Tagging as ${BUILD}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No cache-from/cache-to on purpose. The GHA cache is capped at 10 GB per
      # repo and the torch layer alone blows past that, so caching would evict
      # itself every run and cost upload time for nothing. Rebuilds are rare.
      #
      # provenance: false keeps this a plain single-arch manifest. The default
      # attestation manifest has tripped up third-party pullers, and RunPod has
      # no use for it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./wan-blackwell
          push: true
          provenance: false
          # No :latest. A RunPod template pins whatever tag you paste into it,
          # and a moving tag means the pod you booted last week is not the pod
          # you boot today with no way to tell. Both tags here are immutable.
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.build }}
            ${{ env.IMAGE }}:sha-${{ steps.tags.outputs.short }}

      # Plain inspect, no --format: provenance:false leaves a single-arch
      # manifest, so a template ranging over .Manifest.Manifests errors out.
      - name: Report image
        run: |
          REF="${{ env.IMAGE }}:${{ steps.tags.outputs.build }}"
          docker buildx imagetools inspect "$REF"
          df -h /
          # Surfaced on the run summary page so the exact ref to paste into the
          # RunPod template is one click away rather than dug out of the log.
          {
            echo '### Image published'
            echo
            echo '```'
            echo "$REF"
            echo '```'
            echo
            echo "Also tagged \`sha-${{ steps.tags.outputs.short }}\`."
            echo "Paste the ref above into the RunPod template — there is no \`latest\`."
          } >> "$GITHUB_STEP_SUMMARY"
